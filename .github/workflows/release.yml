name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    # Job-level: only this job attests, and a job-level block replaces the
    # workflow-level one, so contents: write is restated.
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7.0.1

      # A JDK the build workflow's matrix verifies against, so a release never
      # ships something the build check hasn't already proven compiles and
      # passes. Bytecode is still --release 21; the class-version check below
      # enforces it.
      - uses: actions/setup-java@v6.1.0
        with:
          java-version: "25"
          distribution: temurin
          cache: maven

      # The release profile adds the CycloneDX SBOMs (task 188). Signing is
      # Central's concern (publish-central.yml), so GPG is skipped here.
      - name: Build and test
        run: ./mvnw -B --no-transfer-progress -Prelease -Dgpg.skip=true verify

      # A JDK 25 toolchain that lost --release 21 would ship bytecode Java 21
      # consumers cannot load. Fail before anything is uploaded or released.
      - name: Check released classes are Java 21 bytecode (major 65)
        run: |
          shopt -s nullglob
          jars=()
          for j in data-prism-*/target/data-prism-*.jar; do
            case "$j" in *-sources.jar|*-javadoc.jar) continue ;; esac
            jars+=("$j")
          done
          if [ "${#jars[@]}" -eq 0 ]; then
            echo "::error::no jars found to check"
            exit 1
          fi
          .github/scripts/check-class-version.sh 65 "${jars[@]}"

      # One SBOM per module deployed to Central, named as Central names it
      # (<artifactId>-<version>-cyclonedx.json). Modules that are not deployed
      # build no SBOM, so a missing file is not an error but an empty set is.
      - name: Collect SBOMs
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          mkdir -p sbom
          for bom in target/bom.json data-prism-*/target/bom.json; do
            [ -f "$bom" ] || continue
            module="$(basename "$(dirname "$(dirname "$bom")")")"
            [ "$module" = "." ] && module=data-prism
            cp "$bom" "sbom/${module}-${version}-cyclonedx.json"
          done
          ls -l sbom
          if [ -z "$(ls -A sbom)" ]; then
            echo "::error::no SBOMs produced"
            exit 1
          fi

      # Provenance for every file uploaded to the release below.
      - name: Attest build provenance of the release assets
        uses: actions/attest-build-provenance@v4.2.2
        with:
          subject-path: sbom/*-cyclonedx.json

      # This workflow only turns a pushed tag into a GitHub Release (with the
      # SBOMs attached). It does not publish to Maven Central (task 36) and does not build an image
      # (task 37).
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes \
            sbom/*-cyclonedx.json
