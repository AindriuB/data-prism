name: publish-image

# Builds and verifies docker/distribution/Dockerfile on every `v*` tag, but
# never pushes automatically: pushing a live image to
# ghcr.io/aindriub/data-prism-server is an explicit, owner-decided action,
# not something a tag push alone should trigger. The `publish` job below only
# runs for a manually-started workflow_dispatch run made against a `v*` tag
# ref — see its own `if:` and its version guard step — so a tag push builds
# and proves the image fail-closed, and nothing more, until someone re-runs
# this workflow by hand, choosing that tag as the ref, to publish it. A
# dispatch left on a branch (the default when opening "Run workflow") never
# satisfies the tag-ref check and never reaches GHCR.
#
# Task 55 extends this same shape to publish the Compose quickstart's own
# four images (data-prism-quickstart-server, -fixtures, -issuer and
# -certs-init — the four services compose.yaml's own `build:` blocks used to
# build from source, see docker/server, docker/fixtures, docker/issuer and
# docker/certs-init) under the same GHCR namespace, at the same reactor
# version, gated by the exact same conditions as the distribution image. Its
# build/verify steps are unguarded like the distribution image's own; its
# push/login/manifest-assembly steps carry the identical `if:` guarding the
# distribution image's own registry-touching steps.
#
# The image is published as a multi-architecture manifest list
# (linux/amd64 + linux/arm64). A `docker save` / `docker load` tarball cannot
# carry a manifest list, so each architecture is built, loaded and verified
# natively — `ubuntu-latest` for amd64, `ubuntu-24.04-arm` for arm64 — inside
# its own `build-and-verify` matrix leg, and only *that* leg's own gated steps
# push its image, by digest, to GHCR. Because the matrix legs are now the
# steps that write to the registry, not just the final `publish` job, every
# guard that used to live only in `publish` — the tag-ref/dispatch condition
# and the reactor-version comparison — is duplicated inside each matrix leg,
# ahead of its own login step. A plain `v*` tag push, or a dispatch left on a
# branch, must still produce no registry write of any kind, digest-only
# pushes included: neither matrix leg's push/login/guard steps run outside
# the gated condition, and the guard step is re-evaluated independently in
# every job that logs in, rather than trusted from a sibling job or an
# earlier step in the same job.
#
# Task 188: every pushed digest is also signed (keyless cosign) and gets a
# build-provenance attestation, and every image is pushed with a buildx SBOM
# and provenance attestation. The per-architecture digests are signed in each
# matrix leg and the assembled manifest lists in `publish`, all behind the
# same guards as the pushes. `id-token: write` and `attestations: write` are
# granted on those two jobs only. docs/verifying-releases.md says how to verify.
#
# An earlier decision here (recorded through task 40) was to re-push the
# already-released version's tag rather than cut a new one: main and the
# release tag were then the same tree, and the decision was conditioned on
# nothing external referencing the image yet. It was revisited on
# 2026-09-17 and reversed, for two reasons. First, the release tag predates
# this multi-architecture publish pipeline: workflow_dispatch reads the
# workflow file from the ref it is dispatched on, so dispatching against
# that tag would silently re-run the old single-architecture pipeline
# instead of publishing a multi-arch image. Second, main has since diverged
# from the tag (CI action bumps, documentation, a quickstart dependency
# pin), so an image built from main and labelled with the old version would
# not correspond to the tagged tree. Cutting a patch version is cheaper and
# more honest than force-moving a tag a published GitHub Release already
# points at, and keeps the image tag, server.json and the poms in
# agreement with what is actually in the tree.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: >-
          Image tag to publish (must match the reactor version in pom.xml,
          e.g. 0.7.1). Only used for the workflow_dispatch push step.
        required: true
        default: "0.7.1"

permissions:
  contents: read
  packages: write

jobs:
  build-and-verify:
    strategy:
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    # Job-level, not workflow-level: only the jobs that sign or attest get
    # an OIDC token. A job-level block replaces the workflow-level one, so
    # the two grants the job already relied on are restated.
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7.0.1

      # The default "docker" buildx driver (what `docker buildx` uses on a
      # freshly provisioned runner, same as on this developer's own machine)
      # refuses `--output ...,push-by-digest=true` below with "push-by-digest
      # is currently not implemented for docker driver" — verified locally
      # before this step was added. A docker-container driver builder
      # supports it. This does not touch platform emulation: no QEMU/binfmt
      # is registered by this or any other step, so --platform below still
      # only ever matches this leg's native runner architecture.
      - name: Set up a buildx builder that supports push-by-digest
        run: docker buildx create --name matrixbuilder --driver docker-container --use --bootstrap

      # Both ${{ }} expressions this step needs are laundered through env:
      # rather than interpolated straight into the script below.
      # inputs.version is dispatch-time free text, so it becomes
      # $DISPATCH_VERSION; github.event_name is not user-controllable (it is
      # one of GitHub's own fixed event names), but $GITHUB_EVENT_NAME — a
      # default environment variable GitHub Actions already sets on every
      # job — reads the identical value without adding another ${{ }} to the
      # script at all.
      - name: Resolve image version
        id: version
        env:
          DISPATCH_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            version="$DISPATCH_VERSION"
          else
            # v1.2.3 -> 1.2.3
            version="${GITHUB_REF_NAME#v}"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      # Native build, no emulation: matrix.platform always matches this leg's
      # runner architecture (amd64 on ubuntu-latest, arm64 on
      # ubuntu-24.04-arm), and no docker/setup-qemu-action or binfmt
      # registration exists anywhere in this workflow. If a runner label ever
      # resolved to the wrong host architecture, this step would fail loudly
      # — buildx refuses a --platform it cannot satisfy natively rather than
      # silently falling back to emulation — instead of quietly publishing an
      # image built under QEMU.
      #
      # steps.version.outputs.version carries the exact same dispatch-time
      # text as inputs.version above, just relayed through $GITHUB_OUTPUT —
      # laundering *where the value entered* the workflow does not launder
      # *every later place it is read*, so this step needs its own env:
      # rather than trusting the earlier step's fix to cover it.
      - name: Build distributable image
        env:
          VERSION: ${{ steps.version.outputs.version }}
          ARCH: ${{ matrix.arch }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          docker buildx build -f docker/distribution/Dockerfile \
            --platform "$PLATFORM" \
            -t "ghcr.io/aindriub/data-prism-server:${VERSION}-${ARCH}" \
            --load \
            .

      # A fail-open image must never reach the registry: run the image with
      # no mounted configuration and no adapter jar and require it to exit
      # non-zero with a named dataprism refusal, exactly the contract
      # DataPrismContractValidator and DataPrismProperties.validate() give
      # every deployment. This is the same check docs/plan/tasks/37 requires
      # of a human running the image locally; here it gates the push — now on
      # the native image for *this* architecture, run before any login or
      # push step in this job.
      - name: Verify the image refuses to start with no configuration
        env:
          VERSION: ${{ steps.version.outputs.version }}
          ARCH: ${{ matrix.arch }}
        run: |
          set +e
          output="$(docker run --rm "ghcr.io/aindriub/data-prism-server:${VERSION}-${ARCH}" 2>&1)"
          status=$?
          set -e
          echo "$output"
          echo "exit status: ${status}"
          if [ "$status" -eq 0 ]; then
            echo "::error::image started with no configuration; it must refuse"
            exit 1
          fi
          # MISSING_, not a bare [A-Z_]+: every dataprism refusal code this
          # image can hit on a fail-closed startup is named MISSING_*
          # (MISSING_IDENTITY_RESOLVER, MISSING_JWT_ISSUER,
          # MISSING_SOURCE_ADAPTER, ...) — see DataPrismContractValidator and
          # DataPrismProperties.validate(). Tightening the match to that
          # prefix means an unrelated DataPrismConfigurationException (a
          # malformed value, say) no longer satisfies this gate by accident;
          # it is still order-independent across whichever MISSING_* check
          # happens to fire first.
          code="$(printf '%s\n' "$output" \
            | grep -oE 'DataPrismConfigurationException: MISSING_[A-Z_]+' \
            | head -n1)"
          if [ -z "$code" ]; then
            echo "::error::image exited non-zero but printed no named dataprism refusal code"
            exit 1
          fi
          echo "refusal code: ${code}"

      # Task 55: the three quickstart images built from source in
      # compose.yaml's own from-source path (compose.build.yaml), plus the
      # certs-init helper image that same file also builds, published here
      # so the default compose.yaml can pull all four instead. Built
      # unguarded, on every plain tag push, same as the distribution image
      # above — this only builds and loads locally; nothing here touches the
      # registry yet. None of these carries a no-configuration refusal
      # contract (that check is specific to docker/distribution/Dockerfile's
      # DataPrismContractValidator gate), so none is verified the way the
      # distribution image is above.
      - name: Build quickstart server image
        env:
          VERSION: ${{ steps.version.outputs.version }}
          ARCH: ${{ matrix.arch }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          docker buildx build -f docker/server/Dockerfile \
            --platform "$PLATFORM" \
            -t "ghcr.io/aindriub/data-prism-quickstart-server:${VERSION}-${ARCH}" \
            --load \
            .

      - name: Build quickstart fixtures image
        env:
          VERSION: ${{ steps.version.outputs.version }}
          ARCH: ${{ matrix.arch }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          docker buildx build -f docker/fixtures/Dockerfile \
            --platform "$PLATFORM" \
            -t "ghcr.io/aindriub/data-prism-quickstart-fixtures:${VERSION}-${ARCH}" \
            --load \
            .

      - name: Build quickstart issuer image
        env:
          VERSION: ${{ steps.version.outputs.version }}
          ARCH: ${{ matrix.arch }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          docker buildx build -f docker/issuer/Dockerfile \
            --platform "$PLATFORM" \
            -t "ghcr.io/aindriub/data-prism-quickstart-issuer:${VERSION}-${ARCH}" \
            --load \
            .

      # certs-init ships no jar and carries no VERSION build-arg: it copies a
      # shell script (docker/certs-init/generate-certs.sh), not a Maven
      # artifact, so nothing about its image content depends on the reactor
      # version — only its published *tag* is the reactor version, to keep
      # it releasing in lockstep with the other three images.
      - name: Build quickstart certs-init image
        env:
          VERSION: ${{ steps.version.outputs.version }}
          ARCH: ${{ matrix.arch }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          docker buildx build -f docker/certs-init/Dockerfile \
            --platform "$PLATFORM" \
            -t "ghcr.io/aindriub/data-prism-quickstart-certs-init:${VERSION}-${ARCH}" \
            --load \
            .

      # Everything from here down writes to the registry (a Maven download of
      # the reactor version, a GHCR login, a digest push) and is gated on the
      # exact condition the `publish` job below also carries at job level.
      # It has to be repeated per step, not hoisted to a job-level `if:`,
      # because the build and verification steps above must still run
      # unguarded on every plain tag push — that is what proves each
      # architecture fail-closed before anyone chooses to publish it.
      - name: Set up JDK for reactor version check
        if: >-
          github.event_name == 'workflow_dispatch' &&
          startsWith(github.ref, 'refs/tags/v')
        uses: actions/setup-java@v6.1.0
        with:
          java-version: "25"
          distribution: temurin
          cache: maven

      # Repeated here rather than trusted from the `publish` job: this leg is
      # itself a job that pushes to GHCR (by digest), so it fails closed on
      # its own. This step's job-level trigger condition above already
      # restricts it to a `v*` tag ref; this step additionally refuses if the
      # version supplied at dispatch time disagrees with the reactor's own
      # version, so a stale or mistyped dispatch input cannot publish a
      # digest tagged with a version the jar inside it does not match.
      - name: Guard dispatch version matches reactor version
        if: >-
          github.event_name == 'workflow_dispatch' &&
          startsWith(github.ref, 'refs/tags/v')
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          reactor_version="$(./mvnw -B -q -DforceStdout help:evaluate -Dexpression=project.version)"
          if [ "$VERSION" != "$reactor_version" ]; then
            echo "::error::dispatch version ${VERSION} does not match reactor version ${reactor_version}"
            exit 1
          fi

      - name: Log in to GHCR
        if: >-
          github.event_name == 'workflow_dispatch' &&
          startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # push-by-digest=true and name-canonical=true: this pushes the image's
      # blobs and manifest to ghcr.io/aindriub/data-prism-server without
      # creating any human-visible tag for this single-architecture image —
      # only the final digest (captured below via --metadata-file) leaves
      # this job. The `publish` job assembles the two digests (amd64, arm64)
      # into the actual `:VERSION` and `:latest` manifest list tags; no
      # per-architecture tag is ever published on its own. This rebuilds the
      # image rather than re-pushing the --load result above (buildx has no
      # "push what I already loaded" step), but reuses that build's layer
      # cache on this same runner, so it costs a manifest push, not a
      # rebuild.
      - name: Push image by digest
        if: >-
          github.event_name == 'workflow_dispatch' &&
          startsWith(github.ref, 'refs/tags/v')
        env:
          PLATFORM: ${{ matrix.platform }}
          ARCH: ${{ matrix.arch }}
        run: |
          mkdir -p /tmp/digest
          docker buildx build -f docker/distribution/Dockerfile \
            --platform "$PLATFORM" \
            --output type=image,name=ghcr.io/aindriub/data-prism-server,push=true,push-by-digest=true,name-canonical=true \
            --sbom=true \
            --provenance=mode=max \
            --metadata-file /tmp/metadata.json \
            .
          digest="$(jq -r '."containerimage.digest"' /tmp/metadata.json)"
          echo "$digest" > "/tmp/digest/${ARCH}"
          echo "pushed digest: ${digest}"

      - name: Upload digest
        if: >-
          github.event_name == 'workflow_dispatch' &&
          startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v7.0.2
        with:
          name: digest-${{ matrix.arch }}
          path: /tmp/digest/*
          if-no-files-found: error
          retention-days: 1

      # Task 55: the same push-by-digest/assemble-manifest split as the
      # distribution image above, for the three quickstart images and the
      # certs-init helper image, gated identically. Written into their own
      # /tmp/digest-quickstart directory, not /tmp/digest, so none of these
      # four uploads' files are ever swept up by the distribution image's own
      # `path: /tmp/digest/*` upload above — that upload's contents, and the
      # distribution manifest assembled from them below in `publish`, stay
      # exactly what they were before this task.
      - name: Push quickstart server image by digest
        if: >-
          github.event_name == 'workflow_dispatch' &&
          startsWith(github.ref, 'refs/tags/v')
        env:
          VERSION: ${{ steps.version.outputs.version }}
          PLATFORM: ${{ matrix.platform }}
          ARCH: ${{ matrix.arch }}
        run: |
          mkdir -p /tmp/digest-quickstart
          docker buildx build -f docker/server/Dockerfile \
            --platform "$PLATFORM" \
            --output type=image,name=ghcr.io/aindriub/data-prism-quickstart-server,push=true,push-by-digest=true,name-canonical=true \
            --sbom=true \
            --provenance=mode=max \
            --metadata-file /tmp/metadata-quickstart-server.json \
            .
          digest="$(jq -r '."containerimage.digest"' /tmp/metadata-quickstart-server.json)"
          echo "$digest" > "/tmp/digest-quickstart/server-${ARCH}"
          echo "pushed digest: ${digest}"

      - name: Upload quickstart server digest
        if: >-
          github.event_name == 'workflow_dispatch' &&
          startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v7.0.2
        with:
          name: digest-quickstart-server-${{ matrix.arch }}
          path: /tmp/digest-quickstart/server-${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 1

      - name: Push quickstart fixtures image by digest
        if: >-
          github.event_name == 'workflow_dispatch' &&
          startsWith(github.ref, 'refs/tags/v')
        env:
          VERSION: ${{ steps.version.outputs.version }}
          PLATFORM: ${{ matrix.platform }}
          ARCH: ${{ matrix.arch }}
        run: |
          mkdir -p /tmp/digest-quickstart
          docker buildx build -f docker/fixtures/Dockerfile \
            --platform "$PLATFORM" \
            --output type=image,name=ghcr.io/aindriub/data-prism-quickstart-fixtures,push=true,push-by-digest=true,name-canonical=true \
            --sbom=true \
            --provenance=mode=max \
            --metadata-file /tmp/metadata-quickstart-fixtures.json \
            .
          digest="$(jq -r '."containerimage.digest"' /tmp/metadata-quickstart-fixtures.json)"
          echo "$digest" > "/tmp/digest-quickstart/fixtures-${ARCH}"
          echo "pushed digest: ${digest}"

      - name: Upload quickstart fixtures digest
        if: >-
          github.event_name == 'workflow_dispatch' &&
          startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v7.0.2
        with:
          name: digest-quickstart-fixtures-${{ matrix.arch }}
          path: /tmp/digest-quickstart/fixtures-${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 1

      - name: Push quickstart issuer image by digest
        if: >-
          github.event_name == 'workflow_dispatch' &&
          startsWith(github.ref, 'refs/tags/v')
        env:
          VERSION: ${{ steps.version.outputs.version }}
          PLATFORM: ${{ matrix.platform }}
          ARCH: ${{ matrix.arch }}
        run: |
          mkdir -p /tmp/digest-quickstart
          docker buildx build -f docker/issuer/Dockerfile \
            --platform "$PLATFORM" \
            --output type=image,name=ghcr.io/aindriub/data-prism-quickstart-issuer,push=true,push-by-digest=true,name-canonical=true \
            --sbom=true \
            --provenance=mode=max \
            --metadata-file /tmp/metadata-quickstart-issuer.json \
            .
          digest="$(jq -r '."containerimage.digest"' /tmp/metadata-quickstart-issuer.json)"
          echo "$digest" > "/tmp/digest-quickstart/issuer-${ARCH}"
          echo "pushed digest: ${digest}"

      - name: Upload quickstart issuer digest
        if: >-
          github.event_name == 'workflow_dispatch' &&
          startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v7.0.2
        with:
          name: digest-quickstart-issuer-${{ matrix.arch }}
          path: /tmp/digest-quickstart/issuer-${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 1

      - name: Push quickstart certs-init image by digest
        if: >-
          github.event_name == 'workflow_dispatch' &&
          startsWith(github.ref, 'refs/tags/v')
        env:
          VERSION: ${{ steps.version.outputs.version }}
          PLATFORM: ${{ matrix.platform }}
          ARCH: ${{ matrix.arch }}
        run: |
          mkdir -p /tmp/digest-quickstart
          docker buildx build -f docker/certs-init/Dockerfile \
            --platform "$PLATFORM" \
            --output type=image,name=ghcr.io/aindriub/data-prism-quickstart-certs-init,push=true,push-by-digest=true,name-canonical=true \
            --sbom=true \
            --provenance=mode=max \
            --metadata-file /tmp/metadata-quickstart-certs-init.json \
            .
          digest="$(jq -r '."containerimage.digest"' /tmp/metadata-quickstart-certs-init.json)"
          echo "$digest" > "/tmp/digest-quickstart/certs-init-${ARCH}"
          echo "pushed digest: ${digest}"

      - name: Upload quickstart certs-init digest
        if: >-
          github.event_name == 'workflow_dispatch' &&
          startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v7.0.2
        with:
          name: digest-quickstart-certs-init-${{ matrix.arch }}
          path: /tmp/digest-quickstart/certs-init-${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 1

      # Task 188: sign and attest every per-architecture digest pushed above.
      # Keyless: cosign and the attestation action use this job's GitHub OIDC
      # token, so no signing key is stored. Same tag-ref/dispatch guard as the
      # pushes, and these steps come after the version guard step above, so a
      # plain `v*` tag push (or a branch dispatch) reaches none of them. Each
      # image's buildx --sbom/--provenance attestations were pushed with the
      # digest itself.
      - name: Read pushed digests
        id: digests
        if: >-
          github.event_name == 'workflow_dispatch' &&
          startsWith(github.ref, 'refs/tags/v')
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          for f in "/tmp/digest/${ARCH}" \
                   "/tmp/digest-quickstart/server-${ARCH}" \
                   "/tmp/digest-quickstart/fixtures-${ARCH}" \
                   "/tmp/digest-quickstart/issuer-${ARCH}" \
                   "/tmp/digest-quickstart/certs-init-${ARCH}"; do
            if ! test -s "$f"; then
              echo "::error::digest file ${f} is missing or empty; its push step did not record a digest"
              exit 1
            fi
          done
          {
            echo "dist=$(cat "/tmp/digest/${ARCH}")"
            echo "server=$(cat "/tmp/digest-quickstart/server-${ARCH}")"
            echo "fixtures=$(cat "/tmp/digest-quickstart/fixtures-${ARCH}")"
            echo "issuer=$(cat "/tmp/digest-quickstart/issuer-${ARCH}")"
            echo "certs_init=$(cat "/tmp/digest-quickstart/certs-init-${ARCH}")"
          } >> "$GITHUB_OUTPUT"

      - uses: sigstore/cosign-installer@v4.1.2
        if: >-
          github.event_name == 'workflow_dispatch' &&
          startsWith(github.ref, 'refs/tags/v')

      - name: Sign every pushed per-architecture digest
        if: >-
          github.event_name == 'workflow_dispatch' &&
          startsWith(github.ref, 'refs/tags/v')
        env:
          DIGEST_DIST: ${{ steps.digests.outputs.dist }}
          DIGEST_SERVER: ${{ steps.digests.outputs.server }}
          DIGEST_FIXTURES: ${{ steps.digests.outputs.fixtures }}
          DIGEST_ISSUER: ${{ steps.digests.outputs.issuer }}
          DIGEST_CERTS_INIT: ${{ steps.digests.outputs.certs_init }}
        run: |
          cosign sign --yes "ghcr.io/aindriub/data-prism-server@${DIGEST_DIST}"
          cosign sign --yes "ghcr.io/aindriub/data-prism-quickstart-server@${DIGEST_SERVER}"
          cosign sign --yes "ghcr.io/aindriub/data-prism-quickstart-fixtures@${DIGEST_FIXTURES}"
          cosign sign --yes "ghcr.io/aindriub/data-prism-quickstart-issuer@${DIGEST_ISSUER}"
          cosign sign --yes "ghcr.io/aindriub/data-prism-quickstart-certs-init@${DIGEST_CERTS_INIT}"

      - name: Attest build provenance of the distribution image (this architecture)
        if: >-
          github.event_name == 'workflow_dispatch' &&
          startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest-build-provenance@v4.2.2
        with:
          subject-name: ghcr.io/aindriub/data-prism-server
          subject-digest: ${{ steps.digests.outputs.dist }}
          push-to-registry: true

      - name: Attest build provenance of the quickstart server image (this architecture)
        if: >-
          github.event_name == 'workflow_dispatch' &&
          startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest-build-provenance@v4.2.2
        with:
          subject-name: ghcr.io/aindriub/data-prism-quickstart-server
          subject-digest: ${{ steps.digests.outputs.server }}
          push-to-registry: true

      - name: Attest build provenance of the quickstart fixtures image (this architecture)
        if: >-
          github.event_name == 'workflow_dispatch' &&
          startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest-build-provenance@v4.2.2
        with:
          subject-name: ghcr.io/aindriub/data-prism-quickstart-fixtures
          subject-digest: ${{ steps.digests.outputs.fixtures }}
          push-to-registry: true

      - name: Attest build provenance of the quickstart issuer image (this architecture)
        if: >-
          github.event_name == 'workflow_dispatch' &&
          startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest-build-provenance@v4.2.2
        with:
          subject-name: ghcr.io/aindriub/data-prism-quickstart-issuer
          subject-digest: ${{ steps.digests.outputs.issuer }}
          push-to-registry: true

      - name: Attest build provenance of the quickstart certs-init image (this architecture)
        if: >-
          github.event_name == 'workflow_dispatch' &&
          startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest-build-provenance@v4.2.2
        with:
          subject-name: ghcr.io/aindriub/data-prism-quickstart-certs-init
          subject-digest: ${{ steps.digests.outputs.certs_init }}
          push-to-registry: true

  # Never runs from a plain tag push, and never from a workflow_dispatch off
  # a branch either: both the trigger condition below and the guard step
  # inside this job have to agree the ref is a `v*` tag before anything here
  # can push. Two clicks on this workflow's "Run workflow" button, left on
  # its default branch, must not be enough to reach GHCR — that was the
  # defect a review found in an earlier version of this job, which gated
  # only on workflow_dispatch and trusted the dispatch-time version input on
  # its own.
  #
  # `needs: build-and-verify` covers every expansion of that job's matrix:
  # GitHub Actions only satisfies a `needs:` on a matrix job once every leg
  # has succeeded, and neither that job nor this one uses `if: always()`,
  # `continue-on-error` or `fail-fast: false` to let a missing or failed leg
  # be skipped over. If the arm64 leg cannot even schedule — the
  # `ubuntu-24.04-arm` label failing to resolve — the matrix job fails and
  # this job never runs, so no path exists to an amd64-only manifest.
  publish:
    needs: build-and-verify
    if: >-
      github.event_name == 'workflow_dispatch' &&
      startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    # Bound once, at the job level, rather than interpolating
    # ${{ inputs.version }} straight into each step's `run:` shell text: a
    # crafted dispatch input containing shell metacharacters would otherwise
    # be spliced into the script before the shell ever sees "$VERSION" as a
    # plain variable. Exploiting this needs write access to dispatch the
    # workflow in the first place, so this is hardening, not a hole.
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-java@v6.1.0
        with:
          java-version: "25"
          distribution: temurin
          cache: maven

      # Repeated here rather than trusted from the matrix legs: this is the
      # job that assembles and pushes the manifest list itself, so it fails
      # closed on its own, mirroring the guard shape used by the Maven
      # Central publish workflow (task 36) before it deploys. The job's own
      # `if:` above already restricts this to a `v*` tag ref; this step
      # additionally refuses if the version supplied at dispatch time
      # disagrees with the reactor's own version, so a stale or mistyped
      # dispatch input cannot publish a manifest list tagged with a version
      # the digests underneath it do not match.
      - name: Guard dispatch version matches reactor version
        run: |
          reactor_version="$(./mvnw -B -q -DforceStdout help:evaluate -Dexpression=project.version)"
          if [ "$VERSION" != "$reactor_version" ]; then
            echo "::error::dispatch version ${VERSION} does not match reactor version ${reactor_version}"
            exit 1
          fi

      # merge-multiple: true flattens both per-arch artifacts (each holding
      # one file, named after its architecture) into a single directory
      # rather than nesting them under artifact-name subdirectories, so the
      # step below can read /tmp/digests/amd64 and /tmp/digests/arm64
      # directly.
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: digest-*
          path: /tmp/digests
          merge-multiple: true

      - name: Log in to GHCR
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Assemble and push manifest list
        run: |
          amd64_digest="$(cat /tmp/digests/amd64)"
          arm64_digest="$(cat /tmp/digests/arm64)"
          docker buildx imagetools create \
            -t "ghcr.io/aindriub/data-prism-server:${VERSION}" \
            -t ghcr.io/aindriub/data-prism-server:latest \
            "ghcr.io/aindriub/data-prism-server@${amd64_digest}" \
            "ghcr.io/aindriub/data-prism-server@${arm64_digest}"

      - name: Verify the pushed manifest lists cover both architectures
        run: |
          for tag in "${VERSION}" latest; do
            archs="$(docker manifest inspect "ghcr.io/aindriub/data-prism-server:${tag}" \
              | jq -r '.manifests[].platform.architecture' | sort)"
            echo "${tag}: ${archs}"
            echo "${archs}" | grep -qx amd64
            echo "${archs}" | grep -qx arm64
          done

      # Task 55: the same digest-assembly-into-manifest-list step as the
      # distribution image above, repeated once per quickstart image, each
      # reading its own two per-architecture digest files out of
      # /tmp/digests (downloaded once, above, by the same `digest-*` pattern
      # that already covers these four images' own artifact names) rather
      # than the distribution image's `amd64`/`arm64` files.
      - name: Assemble and push quickstart server manifest list
        run: |
          amd64_digest="$(cat /tmp/digests/server-amd64)"
          arm64_digest="$(cat /tmp/digests/server-arm64)"
          docker buildx imagetools create \
            -t "ghcr.io/aindriub/data-prism-quickstart-server:${VERSION}" \
            -t ghcr.io/aindriub/data-prism-quickstart-server:latest \
            "ghcr.io/aindriub/data-prism-quickstart-server@${amd64_digest}" \
            "ghcr.io/aindriub/data-prism-quickstart-server@${arm64_digest}"

      - name: Verify the pushed quickstart server manifest lists cover both architectures
        run: |
          for tag in "${VERSION}" latest; do
            archs="$(docker manifest inspect "ghcr.io/aindriub/data-prism-quickstart-server:${tag}" \
              | jq -r '.manifests[].platform.architecture' | sort)"
            echo "${tag}: ${archs}"
            echo "${archs}" | grep -qx amd64
            echo "${archs}" | grep -qx arm64
          done

      - name: Assemble and push quickstart fixtures manifest list
        run: |
          amd64_digest="$(cat /tmp/digests/fixtures-amd64)"
          arm64_digest="$(cat /tmp/digests/fixtures-arm64)"
          docker buildx imagetools create \
            -t "ghcr.io/aindriub/data-prism-quickstart-fixtures:${VERSION}" \
            -t ghcr.io/aindriub/data-prism-quickstart-fixtures:latest \
            "ghcr.io/aindriub/data-prism-quickstart-fixtures@${amd64_digest}" \
            "ghcr.io/aindriub/data-prism-quickstart-fixtures@${arm64_digest}"

      - name: Verify the pushed quickstart fixtures manifest lists cover both architectures
        run: |
          for tag in "${VERSION}" latest; do
            archs="$(docker manifest inspect "ghcr.io/aindriub/data-prism-quickstart-fixtures:${tag}" \
              | jq -r '.manifests[].platform.architecture' | sort)"
            echo "${tag}: ${archs}"
            echo "${archs}" | grep -qx amd64
            echo "${archs}" | grep -qx arm64
          done

      - name: Assemble and push quickstart issuer manifest list
        run: |
          amd64_digest="$(cat /tmp/digests/issuer-amd64)"
          arm64_digest="$(cat /tmp/digests/issuer-arm64)"
          docker buildx imagetools create \
            -t "ghcr.io/aindriub/data-prism-quickstart-issuer:${VERSION}" \
            -t ghcr.io/aindriub/data-prism-quickstart-issuer:latest \
            "ghcr.io/aindriub/data-prism-quickstart-issuer@${amd64_digest}" \
            "ghcr.io/aindriub/data-prism-quickstart-issuer@${arm64_digest}"

      - name: Verify the pushed quickstart issuer manifest lists cover both architectures
        run: |
          for tag in "${VERSION}" latest; do
            archs="$(docker manifest inspect "ghcr.io/aindriub/data-prism-quickstart-issuer:${tag}" \
              | jq -r '.manifests[].platform.architecture' | sort)"
            echo "${tag}: ${archs}"
            echo "${archs}" | grep -qx amd64
            echo "${archs}" | grep -qx arm64
          done

      - name: Assemble and push quickstart certs-init manifest list
        run: |
          amd64_digest="$(cat /tmp/digests/certs-init-amd64)"
          arm64_digest="$(cat /tmp/digests/certs-init-arm64)"
          docker buildx imagetools create \
            -t "ghcr.io/aindriub/data-prism-quickstart-certs-init:${VERSION}" \
            -t ghcr.io/aindriub/data-prism-quickstart-certs-init:latest \
            "ghcr.io/aindriub/data-prism-quickstart-certs-init@${amd64_digest}" \
            "ghcr.io/aindriub/data-prism-quickstart-certs-init@${arm64_digest}"

      - name: Verify the pushed quickstart certs-init manifest lists cover both architectures
        run: |
          for tag in "${VERSION}" latest; do
            archs="$(docker manifest inspect "ghcr.io/aindriub/data-prism-quickstart-certs-init:${tag}" \
              | jq -r '.manifests[].platform.architecture' | sort)"
            echo "${tag}: ${archs}"
            echo "${archs}" | grep -qx amd64
            echo "${archs}" | grep -qx arm64
          done

      # Task 188: sign and attest the assembled manifest lists. The job-level
      # `if:` and the version guard above already gate everything here. The
      # digest is the manifest list's own, read back from the registry after
      # it was pushed; :latest points at the same digest as :VERSION.
      - name: Read manifest list digests
        id: lists
        run: |
          {
            echo "dist=$(docker buildx imagetools inspect "ghcr.io/aindriub/data-prism-server:${VERSION}" --format '{{json .Manifest}}' | jq -r .digest)"
            echo "server=$(docker buildx imagetools inspect "ghcr.io/aindriub/data-prism-quickstart-server:${VERSION}" --format '{{json .Manifest}}' | jq -r .digest)"
            echo "fixtures=$(docker buildx imagetools inspect "ghcr.io/aindriub/data-prism-quickstart-fixtures:${VERSION}" --format '{{json .Manifest}}' | jq -r .digest)"
            echo "issuer=$(docker buildx imagetools inspect "ghcr.io/aindriub/data-prism-quickstart-issuer:${VERSION}" --format '{{json .Manifest}}' | jq -r .digest)"
            echo "certs_init=$(docker buildx imagetools inspect "ghcr.io/aindriub/data-prism-quickstart-certs-init:${VERSION}" --format '{{json .Manifest}}' | jq -r .digest)"
          } >> "$GITHUB_OUTPUT"

      - uses: sigstore/cosign-installer@v4.1.2

      - name: Sign every manifest list
        env:
          DIGEST_DIST: ${{ steps.lists.outputs.dist }}
          DIGEST_SERVER: ${{ steps.lists.outputs.server }}
          DIGEST_FIXTURES: ${{ steps.lists.outputs.fixtures }}
          DIGEST_ISSUER: ${{ steps.lists.outputs.issuer }}
          DIGEST_CERTS_INIT: ${{ steps.lists.outputs.certs_init }}
        run: |
          cosign sign --yes "ghcr.io/aindriub/data-prism-server@${DIGEST_DIST}"
          cosign sign --yes "ghcr.io/aindriub/data-prism-quickstart-server@${DIGEST_SERVER}"
          cosign sign --yes "ghcr.io/aindriub/data-prism-quickstart-fixtures@${DIGEST_FIXTURES}"
          cosign sign --yes "ghcr.io/aindriub/data-prism-quickstart-issuer@${DIGEST_ISSUER}"
          cosign sign --yes "ghcr.io/aindriub/data-prism-quickstart-certs-init@${DIGEST_CERTS_INIT}"

      - name: Attest build provenance of the distribution manifest list
        uses: actions/attest-build-provenance@v4.2.2
        with:
          subject-name: ghcr.io/aindriub/data-prism-server
          subject-digest: ${{ steps.lists.outputs.dist }}
          push-to-registry: true

      - name: Attest build provenance of the quickstart server manifest list
        uses: actions/attest-build-provenance@v4.2.2
        with:
          subject-name: ghcr.io/aindriub/data-prism-quickstart-server
          subject-digest: ${{ steps.lists.outputs.server }}
          push-to-registry: true

      - name: Attest build provenance of the quickstart fixtures manifest list
        uses: actions/attest-build-provenance@v4.2.2
        with:
          subject-name: ghcr.io/aindriub/data-prism-quickstart-fixtures
          subject-digest: ${{ steps.lists.outputs.fixtures }}
          push-to-registry: true

      - name: Attest build provenance of the quickstart issuer manifest list
        uses: actions/attest-build-provenance@v4.2.2
        with:
          subject-name: ghcr.io/aindriub/data-prism-quickstart-issuer
          subject-digest: ${{ steps.lists.outputs.issuer }}
          push-to-registry: true

      - name: Attest build provenance of the quickstart certs-init manifest list
        uses: actions/attest-build-provenance@v4.2.2
        with:
          subject-name: ghcr.io/aindriub/data-prism-quickstart-certs-init
          subject-digest: ${{ steps.lists.outputs.certs_init }}
          push-to-registry: true

      # Task 257 (OD-08-11): sign and attest each per-architecture digest that
      # is reachable from a published tag. The matrix legs signed the
      # per-architecture build indexes they pushed (image plus buildx
      # attestation manifests), but `imagetools create` flattens those into
      # plain platform manifests with different digests, and those carry no
      # signature. The digests below are read back from the pushed manifest
      # lists, so they are exactly what a consumer resolves from the tag.
      - name: Read per-architecture digests reachable from the manifest lists
        id: platforms
        run: |
          platform_digest() {
            local image="$1" arch="$2" found
            found="$(docker manifest inspect "ghcr.io/aindriub/${image}:${VERSION}" \
              | jq -r --arg arch "$arch" '.manifests[] | select(.platform.os != "unknown" and .platform.architecture == $arch and ((.annotations["vnd.docker.reference.type"] // "") != "attestation-manifest")) | .digest')"
            if [ "$(printf '%s\n' "$found" | grep -c '^sha256:')" -ne 1 ]; then
              echo "::error::${image}:${VERSION} must list exactly one ${arch} manifest, got: ${found}" >&2
              exit 1
            fi
            printf '%s' "$found"
          }
          {
            d="$(platform_digest data-prism-server amd64)" || exit 1
            echo "dist_amd64=$d"
            d="$(platform_digest data-prism-server arm64)" || exit 1
            echo "dist_arm64=$d"
            d="$(platform_digest data-prism-quickstart-server amd64)" || exit 1
            echo "server_amd64=$d"
            d="$(platform_digest data-prism-quickstart-server arm64)" || exit 1
            echo "server_arm64=$d"
            d="$(platform_digest data-prism-quickstart-fixtures amd64)" || exit 1
            echo "fixtures_amd64=$d"
            d="$(platform_digest data-prism-quickstart-fixtures arm64)" || exit 1
            echo "fixtures_arm64=$d"
            d="$(platform_digest data-prism-quickstart-issuer amd64)" || exit 1
            echo "issuer_amd64=$d"
            d="$(platform_digest data-prism-quickstart-issuer arm64)" || exit 1
            echo "issuer_arm64=$d"
            d="$(platform_digest data-prism-quickstart-certs-init amd64)" || exit 1
            echo "certs_init_amd64=$d"
            d="$(platform_digest data-prism-quickstart-certs-init arm64)" || exit 1
            echo "certs_init_arm64=$d"
          } >> "$GITHUB_OUTPUT"

      - name: Sign every per-architecture digest reachable from the manifest lists
        env:
          DIGEST_DIST_AMD64: ${{ steps.platforms.outputs.dist_amd64 }}
          DIGEST_DIST_ARM64: ${{ steps.platforms.outputs.dist_arm64 }}
          DIGEST_SERVER_AMD64: ${{ steps.platforms.outputs.server_amd64 }}
          DIGEST_SERVER_ARM64: ${{ steps.platforms.outputs.server_arm64 }}
          DIGEST_FIXTURES_AMD64: ${{ steps.platforms.outputs.fixtures_amd64 }}
          DIGEST_FIXTURES_ARM64: ${{ steps.platforms.outputs.fixtures_arm64 }}
          DIGEST_ISSUER_AMD64: ${{ steps.platforms.outputs.issuer_amd64 }}
          DIGEST_ISSUER_ARM64: ${{ steps.platforms.outputs.issuer_arm64 }}
          DIGEST_CERTS_INIT_AMD64: ${{ steps.platforms.outputs.certs_init_amd64 }}
          DIGEST_CERTS_INIT_ARM64: ${{ steps.platforms.outputs.certs_init_arm64 }}
        run: |
          cosign sign --yes "ghcr.io/aindriub/data-prism-server@${DIGEST_DIST_AMD64}"
          cosign sign --yes "ghcr.io/aindriub/data-prism-server@${DIGEST_DIST_ARM64}"
          cosign sign --yes "ghcr.io/aindriub/data-prism-quickstart-server@${DIGEST_SERVER_AMD64}"
          cosign sign --yes "ghcr.io/aindriub/data-prism-quickstart-server@${DIGEST_SERVER_ARM64}"
          cosign sign --yes "ghcr.io/aindriub/data-prism-quickstart-fixtures@${DIGEST_FIXTURES_AMD64}"
          cosign sign --yes "ghcr.io/aindriub/data-prism-quickstart-fixtures@${DIGEST_FIXTURES_ARM64}"
          cosign sign --yes "ghcr.io/aindriub/data-prism-quickstart-issuer@${DIGEST_ISSUER_AMD64}"
          cosign sign --yes "ghcr.io/aindriub/data-prism-quickstart-issuer@${DIGEST_ISSUER_ARM64}"
          cosign sign --yes "ghcr.io/aindriub/data-prism-quickstart-certs-init@${DIGEST_CERTS_INIT_AMD64}"
          cosign sign --yes "ghcr.io/aindriub/data-prism-quickstart-certs-init@${DIGEST_CERTS_INIT_ARM64}"

      - name: Attest build provenance of the distribution image (amd64 platform manifest)
        uses: actions/attest-build-provenance@v4.2.2
        with:
          subject-name: ghcr.io/aindriub/data-prism-server
          subject-digest: ${{ steps.platforms.outputs.dist_amd64 }}
          push-to-registry: true

      - name: Attest build provenance of the distribution image (arm64 platform manifest)
        uses: actions/attest-build-provenance@v4.2.2
        with:
          subject-name: ghcr.io/aindriub/data-prism-server
          subject-digest: ${{ steps.platforms.outputs.dist_arm64 }}
          push-to-registry: true

      - name: Attest build provenance of the quickstart server image (amd64 platform manifest)
        uses: actions/attest-build-provenance@v4.2.2
        with:
          subject-name: ghcr.io/aindriub/data-prism-quickstart-server
          subject-digest: ${{ steps.platforms.outputs.server_amd64 }}
          push-to-registry: true

      - name: Attest build provenance of the quickstart server image (arm64 platform manifest)
        uses: actions/attest-build-provenance@v4.2.2
        with:
          subject-name: ghcr.io/aindriub/data-prism-quickstart-server
          subject-digest: ${{ steps.platforms.outputs.server_arm64 }}
          push-to-registry: true

      - name: Attest build provenance of the quickstart fixtures image (amd64 platform manifest)
        uses: actions/attest-build-provenance@v4.2.2
        with:
          subject-name: ghcr.io/aindriub/data-prism-quickstart-fixtures
          subject-digest: ${{ steps.platforms.outputs.fixtures_amd64 }}
          push-to-registry: true

      - name: Attest build provenance of the quickstart fixtures image (arm64 platform manifest)
        uses: actions/attest-build-provenance@v4.2.2
        with:
          subject-name: ghcr.io/aindriub/data-prism-quickstart-fixtures
          subject-digest: ${{ steps.platforms.outputs.fixtures_arm64 }}
          push-to-registry: true

      - name: Attest build provenance of the quickstart issuer image (amd64 platform manifest)
        uses: actions/attest-build-provenance@v4.2.2
        with:
          subject-name: ghcr.io/aindriub/data-prism-quickstart-issuer
          subject-digest: ${{ steps.platforms.outputs.issuer_amd64 }}
          push-to-registry: true

      - name: Attest build provenance of the quickstart issuer image (arm64 platform manifest)
        uses: actions/attest-build-provenance@v4.2.2
        with:
          subject-name: ghcr.io/aindriub/data-prism-quickstart-issuer
          subject-digest: ${{ steps.platforms.outputs.issuer_arm64 }}
          push-to-registry: true

      - name: Attest build provenance of the quickstart certs-init image (amd64 platform manifest)
        uses: actions/attest-build-provenance@v4.2.2
        with:
          subject-name: ghcr.io/aindriub/data-prism-quickstart-certs-init
          subject-digest: ${{ steps.platforms.outputs.certs_init_amd64 }}
          push-to-registry: true

      - name: Attest build provenance of the quickstart certs-init image (arm64 platform manifest)
        uses: actions/attest-build-provenance@v4.2.2
        with:
          subject-name: ghcr.io/aindriub/data-prism-quickstart-certs-init
          subject-digest: ${{ steps.platforms.outputs.certs_init_arm64 }}
          push-to-registry: true

      # Fails the release if any digest a consumer can reach from the tag is
      # unsigned: the manifest lists and every platform manifest in them.
      - name: Verify every digest reachable from the tags is signed
        env:
          IDENTITY: https://github.com/${{ github.workflow_ref }}
        run: |
          for image in data-prism-server data-prism-quickstart-server \
                       data-prism-quickstart-fixtures data-prism-quickstart-issuer \
                       data-prism-quickstart-certs-init; do
            list="$(docker buildx imagetools inspect "ghcr.io/aindriub/${image}:${VERSION}" --format '{{json .Manifest}}' | jq -r .digest)"
            # Only real platform manifests: the lists also reference buildx
            # attestation manifests (platform unknown/unknown, reference type
            # attestation-manifest). Those are the SBOM and provenance payloads
            # the signed digests cover; nothing signs them on their own.
            digests="$list $(docker manifest inspect "ghcr.io/aindriub/${image}:${VERSION}" \
              | jq -r '.manifests[] | select(.platform.os != "unknown" and ((.annotations["vnd.docker.reference.type"] // "") != "attestation-manifest")) | .digest')"
            for d in $digests; do
              cosign verify \
                --certificate-identity "$IDENTITY" \
                --certificate-oidc-issuer https://token.actions.githubusercontent.com \
                "ghcr.io/aindriub/${image}@${d}" > /dev/null
              echo "signed: ${image}@${d}"
            done
          done
