name: publish-image

# Builds and verifies docker/distribution/Dockerfile on every `v*` tag, but
# never pushes automatically: pushing a live image to
# ghcr.io/aindriub/data-prism-server is an explicit, owner-decided action,
# not something a tag push alone should trigger. The `publish` job below only
# runs for a manually-started workflow_dispatch run made against a `v*` tag
# ref — see its own `if:` and its version guard step — so a tag push builds
# and proves the image fail-closed, and nothing more, until someone re-runs
# this workflow by hand, choosing that tag as the ref, to publish it. A
# dispatch left on a branch (the default when opening "Run workflow") never
# satisfies the tag-ref check and never reaches GHCR.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: >-
          Image tag to publish (must match the reactor version in pom.xml,
          e.g. 0.1.0). Only used for the workflow_dispatch push step.
        required: true
        default: "0.1.0"

permissions:
  contents: read
  packages: write

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve image version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            version="${{ inputs.version }}"
          else
            # v0.1.0 -> 0.1.0
            version="${GITHUB_REF_NAME#v}"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Build distributable image
        run: |
          docker build -f docker/distribution/Dockerfile \
            -t "ghcr.io/aindriub/data-prism-server:${{ steps.version.outputs.version }}" \
            -t ghcr.io/aindriub/data-prism-server:latest \
            .

      # A fail-open image must never reach the registry: run the image with
      # no mounted configuration and no adapter jar and require it to exit
      # non-zero with a named dataprism refusal, exactly the contract
      # DataPrismContractValidator and DataPrismProperties.validate() give
      # every deployment. This is the same check docs/plan/tasks/37 requires
      # of a human running the image locally; here it gates the push.
      - name: Verify the image refuses to start with no configuration
        run: |
          set +e
          output="$(docker run --rm ghcr.io/aindriub/data-prism-server:latest 2>&1)"
          status=$?
          set -e
          echo "$output"
          echo "exit status: ${status}"
          if [ "$status" -eq 0 ]; then
            echo "::error::image started with no configuration; it must refuse"
            exit 1
          fi
          # MISSING_, not a bare [A-Z_]+: every dataprism refusal code this
          # image can hit on a fail-closed startup is named MISSING_*
          # (MISSING_IDENTITY_RESOLVER, MISSING_JWT_ISSUER,
          # MISSING_SOURCE_ADAPTER, ...) — see DataPrismContractValidator and
          # DataPrismProperties.validate(). Tightening the match to that
          # prefix means an unrelated DataPrismConfigurationException (a
          # malformed value, say) no longer satisfies this gate by accident;
          # it is still order-independent across whichever MISSING_* check
          # happens to fire first.
          code="$(printf '%s\n' "$output" \
            | grep -oE 'DataPrismConfigurationException: MISSING_[A-Z_]+' \
            | head -n1)"
          if [ -z "$code" ]; then
            echo "::error::image exited non-zero but printed no named dataprism refusal code"
            exit 1
          fi
          echo "refusal code: ${code}"

      - name: Save built image for the publish job
        run: docker save ghcr.io/aindriub/data-prism-server:latest -o /tmp/data-prism-server.tar

      - uses: actions/upload-artifact@v4
        with:
          name: data-prism-server-image
          path: /tmp/data-prism-server.tar
          retention-days: 1

  # Never runs from a plain tag push, and never from a workflow_dispatch off
  # a branch either: both the trigger condition below and the guard step
  # inside this job have to agree the ref is a `v*` tag before anything here
  # can push. Two clicks on this workflow's "Run workflow" button, left on
  # its default branch, must not be enough to reach GHCR — that was the
  # defect a review found in an earlier version of this job, which gated
  # only on workflow_dispatch and trusted the dispatch-time version input on
  # its own.
  publish:
    needs: build-and-verify
    if: >-
      github.event_name == 'workflow_dispatch' &&
      startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # Bound once, at the job level, rather than interpolating
    # ${{ inputs.version }} straight into each step's `run:` shell text: a
    # crafted dispatch input containing shell metacharacters would otherwise
    # be spliced into the script before the shell ever sees "$VERSION" as a
    # plain variable. Exploiting this needs write access to dispatch the
    # workflow in the first place, so this is hardening, not a hole.
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      # Repeated here rather than trusted from build-and-verify: this is the
      # job that actually pushes to GHCR, so it fails closed on its own,
      # mirroring the guard shape used by the Maven Central publish workflow
      # (task 36) before it deploys. The job's own `if:` above already
      # restricts this to a `v*` tag ref; this step additionally refuses if
      # the version supplied at dispatch time disagrees with the reactor's
      # own version, so a stale or mistyped dispatch input cannot publish an
      # image tagged with a version the jar inside it does not match.
      - name: Guard dispatch version matches reactor version
        run: |
          reactor_version="$(mvn -B -q -DforceStdout help:evaluate -Dexpression=project.version)"
          if [ "$VERSION" != "$reactor_version" ]; then
            echo "::error::dispatch version ${VERSION} does not match reactor version ${reactor_version}"
            exit 1
          fi

      - uses: actions/download-artifact@v4
        with:
          name: data-prism-server-image
          path: /tmp

      - name: Load built image
        run: docker load -i /tmp/data-prism-server.tar

      - name: Tag image with the resolved version
        run: |
          docker tag ghcr.io/aindriub/data-prism-server:latest \
            "ghcr.io/aindriub/data-prism-server:${VERSION}"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push linux/amd64 image
        run: |
          docker push "ghcr.io/aindriub/data-prism-server:${VERSION}"
          docker push ghcr.io/aindriub/data-prism-server:latest
