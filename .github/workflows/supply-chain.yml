name: supply-chain

# Dependabot reads declared versions. It cannot see a version a BOM manages
# (Spring Boot's, for one), so a vulnerable transitive dependency can sit in
# the resolved tree with no pull request raised. This job builds the resolved
# tree of the root reactor and of the out-of-reactor load-test/ as CycloneDX
# SBOMs and scans them against the OSV database (task 257, OD-08-17).
#
# Fails on any HIGH or CRITICAL advisory: a CVSS score of 7.0 or more, or a
# database severity label of HIGH or CRITICAL. An advisory with neither a
# score nor a label also fails (fail closed); it is accepted only by an entry
# in .github/osv-scanner.toml, which needs a reason and an ignoreUntil date.
# Advisories scored below 7.0, or labelled LOW or MODERATE, are listed in the
# log and the job summary but do not fail the run.
on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  advisory-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-java@v6.1.0
        with:
          java-version: "25"
          distribution: temurin
          cache: maven

      # `package` under the release profile writes target/bom.json for the
      # root and each deployable module (the same SBOMs the release ships).
      # Tests, javadoc and sources are skipped: only the resolved tree matters.
      # cyclonedx-maven-plugin skips modules that are not deployed by default,
      # which would leave the server image's module, the quickstarts and the
      # test modules unscanned; skipNotDeployed=false covers them. This build
      # is the scan's own, so the release SBOMs are unchanged.
      - name: Resolve the reactor tree to SBOMs
        run: >-
          ./mvnw -B --no-transfer-progress -Prelease
          -Dcyclonedx.skipNotDeployed=false
          -DskipTests -Dgpg.skip=true -Dmaven.javadoc.skip=true -Dmaven.source.skip=true
          package

      # load-test/ is outside the reactor and has no parent, so the plugin is
      # run on it directly, at the version the root pom pins.
      - name: Resolve the load-test tree to an SBOM
        run: |
          plugin="$(./mvnw -B -q -DforceStdout help:evaluate -Dexpression=cyclonedx-plugin.version)"
          ./mvnw -B --no-transfer-progress -f load-test/pom.xml \
            "org.cyclonedx:cyclonedx-maven-plugin:${plugin}:makeBom" \
            -DoutputFormat=json

      # Every ignore must carry a reason and an ignoreUntil date, or the
      # scan is not run at all.
      - name: Check the ignore list is justified
        run: |
          awk '
            function flush() { if (inblock && (!reason || !until)) { print "::error::[[IgnoredVulns]] entry ending at line " NR " lacks a reason or an ignoreUntil date"; bad=1 } }
            /^[[:space:]]*\[\[IgnoredVulns\]\]/ { flush(); inblock=1; reason=0; until=0; next }
            /^[[:space:]]*\[/ { flush(); inblock=0; next }
            inblock && /^[[:space:]]*reason[[:space:]]*=[[:space:]]*"[^"]+"/ { reason=1 }
            inblock && /^[[:space:]]*ignoreUntil[[:space:]]*=[[:space:]]*[0-9]{4}-[0-9]{2}-[0-9]{2}/ { until=1 }
            END { flush(); exit bad }
          ' .github/osv-scanner.toml

      - name: Scan for known advisories
        run: |
          shopt -s nullglob
          boms=(target/bom.json data-prism-*/target/bom.json load-test/target/bom.json)
          # The modules that matter most must have produced an SBOM, by name;
          # a count would pass with the wrong files.
          for required in data-prism-server/target/bom.json load-test/target/bom.json; do
            if [ ! -f "$required" ]; then
              echo "::error::${required} was not produced, so it would go unscanned"
              exit 1
            fi
          done
          mkdir -p osv
          failed=0
          for bom in "${boms[@]}"; do
            name="$(echo "$bom" | tr '/' '_')"
            # osv-scanner exits 1 when it finds advisories (judged below) and
            # higher for a scan error, which must fail the run. An SBOM with
            # no components (the aggregator pom, a module with no
            # dependencies) makes it exit 128 ("no packages found"); that is
            # not an error, so such SBOMs are skipped and logged.
            if ! jq -e '(.components // []) | length > 0' "$bom" > /dev/null; then
              echo "skipped ${bom}: no components"
              continue
            fi
            rc=0
            docker run --rm -v "$PWD:/src" -w /src ghcr.io/google/osv-scanner:v2.7.0 \
              scan source --config=/src/.github/osv-scanner.toml \
              --sbom="$bom" --format=json > "osv/${name}.json" || rc=$?
            if [ "$rc" -gt 1 ]; then
              echo "::error::osv-scanner failed on ${bom} (exit ${rc})"
              failed=1
              continue
            fi
            # One row per advisory group. FAIL when the highest CVSS score is
            # 7.0 or more, or the database severity label is HIGH or CRITICAL
            # (some advisories carry a label but no vector), or the advisory
            # has neither a score nor a label (fail closed). Anything else is
            # a warning.
            jq -r --arg bom "$bom" '
              def lbl($p; $ids): [$p.vulnerabilities[]? | select(.id as $i | $ids | index($i))
                                  | .database_specific.severity // empty | ascii_upcase];
              [.results[]?.packages[]? as $p | $p.groups[]?
               | (.ids) as $ids
               | ((.max_severity // "") | tonumber? // null) as $score
               | lbl($p; $ids) as $labels
               | {pkg: ($p.package.name + "@" + $p.package.version), ids: ($ids | join(",")),
                  score: $score, labels: ($labels | unique | join("/")),
                  fail: (($score != null and $score >= 7)
                         or ($labels | any(. == "HIGH" or . == "CRITICAL"))
                         or ($score == null and ($labels | length) == 0))}]
              | .[] | "\(if .fail then "FAIL" else "warn" end) \($bom) \(.pkg) \(.ids) cvss=\(.score // "none") label=\(if .labels == "" then "none" else .labels end)"' \
              "osv/${name}.json" | tee -a osv/rows.txt
          done
          touch osv/rows.txt
          grep '^FAIL' osv/rows.txt > osv/summary.txt || true
          if [ -s osv/summary.txt ]; then failed=1; fi
          {
            echo "### Advisory scan"
            echo '```'
            cat osv/rows.txt
            [ -s osv/rows.txt ] || echo "no advisories"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$failed" -ne 0 ]; then
            echo "::error::HIGH, CRITICAL or unscored advisories, or a scan error; see above"
            exit 1
          fi

      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: advisory-scan
          path: osv/
          if-no-files-found: ignore
