name: publish-central

# Two triggers, two very different amounts of trust:
#
# - `push: tags` runs the `stage` job only. It builds, tests, signs and
#   packages every deployable module under the `release` profile and uploads
#   the result as a workflow artifact so the owner can inspect it — sources
#   jar, javadoc jar and `.asc` for every deployed artifact, pom included.
#   It never calls `mvn deploy` and never talks to the Central Portal.
# - `workflow_dispatch` is the only trigger that can also run `publish`,
#   which does call `mvn deploy`. That job additionally targets the `central`
#   GitHub Environment; if the repository owner has configured that
#   environment with required reviewers (an owner-only, repository-settings
#   step — see the task 36 hand-off), the run pauses for manual approval
#   before anything reaches Central even when dispatched. Nothing in this
#   file, on its own, can publish a tag push straight to Central.
#
# CENTRAL_TOKEN_USERNAME and CENTRAL_TOKEN_PASSWORD are expected to be scoped
# to the `central` GitHub Environment, not the repository: only `publish`
# requests that environment, so `stage` — which runs unattended on every tag
# push — cannot read them even if someone adds `environment:` to it later by
# mistake. `stage` has no `mvn deploy` step and so no use for them anyway;
# do not add them back there.
on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # No server-id/server-username/server-password here: `stage` stops at
      # `verify`, one phase short of `deploy`, and never talks to Central, so
      # it has no use for CENTRAL_TOKEN_USERNAME/CENTRAL_TOKEN_PASSWORD. Those
      # two secrets are expected to live in the `central` GitHub Environment's
      # own scope, not the repository's, so only the approval-gated `publish`
      # job below — which requests that environment — can read them at all.
      # Do not add them back here; a job that can read the Central token no
      # longer needs a human in the loop to reach Central.
      - uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: GPG_PASSPHRASE
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

      # A tag whose name disagrees with the reactor version would attach
      # signed artifacts to a mislabelled release. workflow_dispatch can also
      # target a tag ref, so this runs there too; it is a no-op on a branch
      # ref, which is never version-shaped.
      - name: Guard tag matches reactor version
        if: startsWith(github.ref_name, 'v')
        run: |
          reactor_version="$(mvn -B -q -DforceStdout help:evaluate -Dexpression=project.version)"
          tag_version="${GITHUB_REF_NAME#v}"
          if [ "$reactor_version" != "$tag_version" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match reactor version ${reactor_version}"
            exit 1
          fi

      # The full test suite, then sources/javadoc/signing, all under the
      # `release` profile: a plain `mvn verify` never runs this. Stops at
      # `verify`, one phase short of `deploy`, so nothing here can reach
      # Central regardless of which secrets are present.
      - name: Build, test, sign and package (release profile)
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: mvn -B --no-transfer-progress -Prelease clean verify

      - name: List staged artifacts and signatures
        run: find . -path '*/target/*' -name '*.asc' | sort

      - uses: actions/upload-artifact@v4
        with:
          name: central-staged-artifacts
          retention-days: 14
          if-no-files-found: error
          path: |
            data-prism-*/target/*.jar
            data-prism-*/target/*.asc
            data-prism-*/target/*.pom.asc
            target/*.asc

  publish:
    needs: stage
    if: github.event_name == 'workflow_dispatch'
    environment: central
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven
          server-id: central
          server-username: CENTRAL_TOKEN_USERNAME
          server-password: CENTRAL_TOKEN_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: GPG_PASSPHRASE
        env:
          CENTRAL_TOKEN_USERNAME: ${{ secrets.CENTRAL_TOKEN_USERNAME }}
          CENTRAL_TOKEN_PASSWORD: ${{ secrets.CENTRAL_TOKEN_PASSWORD }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

      # Repeated here rather than trusted from the `stage` job: `publish` runs
      # on its own fresh runner and is the job that actually talks to
      # Central, so it fails closed on its own rather than on a neighbour's
      # earlier check. A workflow_dispatch off a branch (not a tag) never
      # matches this guard and never deploys.
      - name: Guard ref is a version-shaped tag matching the reactor version
        run: |
          case "${GITHUB_REF_NAME}" in
            v*) ;;
            *) echo "::error::refusing to publish from non-tag ref ${GITHUB_REF_NAME}"; exit 1 ;;
          esac
          reactor_version="$(mvn -B -q -DforceStdout help:evaluate -Dexpression=project.version)"
          tag_version="${GITHUB_REF_NAME#v}"
          if [ "$reactor_version" != "$tag_version" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match reactor version ${reactor_version}"
            exit 1
          fi

      # Deploys only the reactor's deployable modules: the six modules this
      # task marks non-deployable set skipPublishing (and maven.deploy.skip)
      # to true in their own poms, so the Central Portal bundle this produces
      # never includes a runnable server or a quickstart fixture. This is the
      # only step in this file that reaches Central, and it only runs when a
      # human dispatches this workflow by hand and, if the `central`
      # environment has required reviewers configured, approves it.
      - name: Build, test, sign and publish to Central (release profile)
        env:
          CENTRAL_TOKEN_USERNAME: ${{ secrets.CENTRAL_TOKEN_USERNAME }}
          CENTRAL_TOKEN_PASSWORD: ${{ secrets.CENTRAL_TOKEN_PASSWORD }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: mvn -B --no-transfer-progress -Prelease clean deploy
