name: pages

# Builds the MkDocs Material site on every pull request that touches it, and
# deploys it to GitHub Pages only from a push to main. Deliberately not a
# required check (task 82): a docs regression should be visible, not block
# every unrelated merge.
#
# The `deploy` job assumes GitHub Pages is already enabled with
# `build_type=workflow` — an owner action (see
# docs/plan/specs/2026-09-23-discoverability.md, "Owner actions"), run once,
# separately from this workflow.
on:
  push:
    branches: ["main"]
    paths: &docs-site-paths
      - "docs/**"
      - "docs-site/**"
      - "mkdocs.yml"
      - "README.md"
      - "CHANGELOG.md"
      - ".github/workflows/pages.yml"
  pull_request:
    paths: *docs-site-paths

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs-site/requirements.txt

      - name: Install the pinned MkDocs toolchain
        run: pip install -r docs-site/requirements.txt

      # --strict turns every `validation.links.*` / `validation.nav.*` warn
      # into a build failure, alongside the site.py hook's own errors for a
      # missing, duplicate or over-length page description.
      - name: Build the site
        run: mkdocs build --strict

      # mkdocs writes root-relative links as `/data-prism/…` (from site_url's
      # own path), which lychee can only resolve given a `--root-dir` whose
      # `data-prism` child is the site itself — hence the bind mount below,
      # rather than mounting `site/` at the container's filesystem root.
      - name: Check links offline (no network access, so a real 404 elsewhere never fails this job)
        run: |
          docker run --rm -v "${{ github.workspace }}/site:/data-root/data-prism" -w /data-root \
            lycheeverse/lychee:0.24.2 --offline --no-progress --root-dir /data-root data-prism

      - name: No excluded path leaked into the built site
        run: |
          set -euo pipefail
          hits="$(find site -path '*/plan/*' -o -path '*/adr/*' -o -name 'pack*' -o -name 'conventions*' -o -name 'workflow*' -o -name 'development-plan*' -o -name 'design-review*')"
          if [ -n "$hits" ]; then
            echo "::error::excluded path present in site/:"
            echo "$hits"
            exit 1
          fi

      # Every `docs-site/hooks/check_*.py`, in sorted order, fails on the
      # first that fails and, so a rename or deletion never silently drops a
      # guard, fails if no file matches. Sitemap-vs-nav agreement, one
      # non-empty <=155-char meta description per page with no page sharing
      # another's, a canonical link under site_url, the OG/Twitter/social-card
      # tags and the third-party-script guard live here. The tester runs
      # this same loop over the same build.
      - name: Run every docs-site guard check
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(docs-site/hooks/check_*.py)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::no docs-site/hooks/check_*.py files found"
            exit 1
          fi
          while IFS= read -r f; do
            echo "::group::$f"
            python3 "$f"
            echo "::endgroup::"
          done < <(printf '%s\n' "${files[@]}" | sort)

      - name: llms.txt exists and its summary is the canonical description
        run: |
          set -euo pipefail
          test -s site/llms.txt
          test -s site/llms-full.txt
          D="Data Prism is an open-source privacy layer for Java/Spring teams putting LLM agents or MCP clients in front of internal APIs holding customer data. It pseudonymises personal data per privacy scope, redacts or refuses anything unclassified, and can keep a hash-chained audit trail."
          grep -F "$D" site/llms.txt

      # Widened to the same pattern the python guard uses. Excludes only
      # Material's own runtime bundle and its source map, and — for those —
      # asserts their third-party references are exactly the two known
      # unpkg.com strings Material 9.7.7 ships (see check_site.py's
      # check_no_third_party_scripts for why those two are unavoidable).
      - name: No third-party scripts, fonts or analytics outside Material's own bundle
        run: |
          set -euo pipefail
          pattern='fonts\.googleapis|fonts\.gstatic|googletagmanager|google-analytics|gtag|unpkg|jsdelivr|cdnjs'
          bundle_path_re='site/assets/javascripts/bundle\.[0-9a-f]+\.min\.js(\.map)?$'

          hits="$(grep -rlE "$pattern" site/ | grep -vE "$bundle_path_re" || true)"
          if [ -n "$hits" ]; then
            echo "::error::found a third-party script/font/analytics reference outside Material's own bundle:"
            echo "$hits"
            exit 1
          fi

          expected=$'https://unpkg.com/mermaid@11/dist/mermaid.min.js\nhttps://unpkg.com/resize-observer-polyfill'
          bundle_hits="$(grep -ohE 'https?://[^"'"'"'\\)[:space:]]+' site/assets/javascripts/bundle.*.min.js site/assets/javascripts/bundle.*.min.js.map 2>/dev/null | grep -E "$pattern" | sort -u || true)"
          if [ "$bundle_hits" != "$(sort <<<"$expected")" ]; then
            echo "::error::Material's bundle's third-party references are not exactly the two expected unpkg.com strings:"
            echo "$bundle_hits"
            exit 1
          fi

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/configure-pages@v6

      - id: deployment
        uses: actions/deploy-pages@v5
