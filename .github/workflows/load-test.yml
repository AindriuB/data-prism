name: load-test

# Manual only: a load run takes minutes and measures the runner, so it is never
# part of a push or pull-request build. See load-test/README.md.
on:
  workflow_dispatch:
    inputs:
      scenario:
        description: "Scenario file name under load-test/scenarios/"
        type: choice
        options:
          - sources-8.json
          - sources-32.json
          - sources-100.json
          - sources-300.json
          - failure-source-timeouts.json
          - failure-read-budget.json
          - failure-over-limit.json
          - ../soak/soak-single-node.json
          - ../soak/soak-three-member.json
        default: sources-8.json

permissions:
  contents: read

jobs:
  load-test:
    runs-on: ubuntu-latest
    # The longest soak scenario runs 8 hours (480 minutes); the margin covers the build, the harness's
    # own tests and the 30-minute close bound. A GitHub-hosted runner stops a job at 6 hours whatever
    # this says, and the soaks are Part B of task 263, run by the owner on a dedicated host.
    timeout-minutes: 540
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-java@v6.2.0
        with:
          java-version: "25"
          distribution: temurin
          cache: maven

      # run.sh builds the server and the extension from this checkout, runs the
      # harness's own unit tests, starts the stack and writes
      # load-test/results/<scenario>-<timestamp>.json. The issuer key and the
      # TLS certificate are generated during the run; no secret is read.
      - name: Run scenario
        env:
          SCENARIO: ${{ inputs.scenario }}
        run: load-test/run.sh "load-test/scenarios/${SCENARIO}"

      # The scenario choice may be a path ("../soak/<file>.json"), which an artifact name cannot hold.
      - name: Name the artifact
        if: always()
        id: artifact
        env:
          SCENARIO: ${{ inputs.scenario }}
        run: echo "name=load-test-$(basename "${SCENARIO}" .json)" >> "$GITHUB_OUTPUT"

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: |
            load-test/results/*.json
            load-test/results/server-failure-*.log
          if-no-files-found: warn
