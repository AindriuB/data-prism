name: load-test

# Manual only: a load run takes minutes and measures the runner, so it is never
# part of a push or pull-request build. See load-test/README.md.
on:
  workflow_dispatch:
    inputs:
      scenario:
        description: "Scenario file name under load-test/scenarios/"
        type: choice
        options:
          - sources-8.json
          - sources-32.json
          - sources-100.json
          - sources-300.json
        default: sources-8.json

permissions:
  contents: read

jobs:
  load-test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          java-version: "25"
          distribution: temurin
          cache: maven

      # run.sh builds the server and the extension from this checkout, runs the
      # harness's own unit tests, starts the stack and writes
      # load-test/results/<scenario>-<timestamp>.json. The issuer key and the
      # TLS certificate are generated during the run; no secret is read.
      - name: Run scenario
        env:
          SCENARIO: ${{ inputs.scenario }}
        run: load-test/run.sh "load-test/scenarios/${SCENARIO}"

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: load-test-${{ inputs.scenario }}
          path: |
            load-test/results/*.json
            load-test/results/server-failure-*.log
          if-no-files-found: warn
