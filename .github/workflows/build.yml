name: build

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Built on the version the artifacts target, so a Java 21 incompatibility
      # fails here rather than in a consumer's build. Local development on a
      # newer JDK is fine because the compiler is pinned to --release 21.
      - uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      # verify runs the architecture rules, the golden vectors and the
      # fail-closed tests, and the enforcer rule that keeps the classpath on a
      # single Jackson major. None of them are optional.
      - name: Build and test
        run: mvn -B --no-transfer-progress verify

      - name: Publish test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: "**/target/surefire-reports/*.txt"
          if-no-files-found: ignore
