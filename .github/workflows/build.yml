name: build

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ["21", "25"]
    steps:
      - uses: actions/checkout@v7

      # 21 is the version the artifacts target, so a Java 21 incompatibility
      # fails here rather than in a consumer's build. 25 is the version the
      # images and the release toolchain run on. The compiler is pinned to
      # --release 21 on both legs.
      - uses: actions/setup-java@v6
        with:
          java-version: ${{ matrix.java }}
          distribution: temurin
          cache: maven

      # verify runs the architecture rules, the golden vectors and the
      # fail-closed tests, and the enforcer rule that keeps the classpath on a
      # single Jackson major. None of them are optional.
      - name: Build and test
        run: mvn -B --no-transfer-progress verify

      # The release profile builds the javadoc jars, and a Javadoc error
      # (typically a {@link} left unresolvable by a package move) fails the
      # release, not the build above. Run the same jar goal here, without
      # signing and without any secret: -Dgpg.skip, and `package` stops before
      # the signing and publishing phases. One leg is enough; Javadoc does not
      # depend on the JDK that runs the tests.
      - name: Javadoc (release profile, unsigned)
        if: matrix.java == '21'
        run: mvn -B --no-transfer-progress -Prelease -DskipTests -Dgpg.skip package

      - name: Publish test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-reports-java-${{ matrix.java }}
          path: "**/target/surefire-reports/*.txt"
          if-no-files-found: ignore

  # Builds the images and forms a two-member cluster (task 143). Needs only
  # Docker with Compose v2, which ubuntu-latest provides.
  container-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Container runtime smoke test
        run: docker/smoke/java-runtime-smoke.sh

      - name: Publish smoke output
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: container-smoke
          path: docker/smoke/target/
          if-no-files-found: ignore

  # The single required check for this workflow. It must list every job in
  # this file: a `needs:` on the matrix job waits for every leg and reports one
  # result for the whole matrix. `if: always()` is essential, because without
  # it a failed need makes this job skipped, and branch protection treats a
  # skipped required check as passing. Every result must be exactly `success`,
  # so failure, cancelled and skipped all fail the gate.
  ci-gate:
    name: ci-gate
    needs: [build, container-smoke]
    if: always()
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Every needed job succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq .
          echo "$NEEDS" | jq -e 'length > 0 and ([.[].result] | all(. == "success"))' > /dev/null
