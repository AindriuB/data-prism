# Continental European, Latin script with diacritics.
#
# Spans Germanic, Romance, Slavic-Latin and Nordic naming, and deliberately
# includes the characters that break naive pipelines: ä ö ü ß, å ø æ, ł ą ę ż,
# ñ, ç, ř ů, þ ð. If any of these come back mangled, something in the path is
# not UTF-8 clean, and it is better to find that here than in a name a person
# actually has.
#
# Written precomposed (NFC). Entries are normalised on load, so a file written
# with combining marks produces the same vocabulary and the same id.

id: european
version: 1
locale: mul
script: Latn

pools:
