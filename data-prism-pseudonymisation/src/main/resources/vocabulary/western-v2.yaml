# Chosen as the default because it is the widest-recognised script among the
# bundled sets, not because it is neutral. Nothing about a pseudonym pool is
# neutral -- see the class comment on VocabularyRegistry.
#
# Replace or extend this rather than editing it in place. Editing changes the
# vocabulary id, which is the mechanism that stops a scope silently drifting
# onto a different pool mid-investigation.

