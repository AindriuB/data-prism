# Irish and Gaelic.
#
# Deliberately keeps the síneadh fada (á é í ó ú) and the Ó/Ní/Mac/Mag surname
# particles. Stripping them would be the exact failure this set exists to avoid:
# a dataset of Irish-language names replaced by unaccented English ones has lost
# something a reader can see, and an investigator looking at the output would
# have no way to tell the source was different.
#
# Surnames here are written in both the Ó (masculine) and Ní (feminine) forms
# because the source data will contain both. Selection is by digest, so a
# pseudonym's particle carries no information about the real subject.

id: irish
version: 1
locale: ga
script: Latn

pools:
  firstNames: [Seán, Aoife, Siobhán, Caoimhe, Niamh, Órla, Pádraig, Ciarán,
               Eoin, Dara, Fionn, Saoirse, Róisín, Éabha, Tadhg, Oisín,
               Cillian, Muireann, Gráinne, Bríd, Aisling, Cathal, Dónal, Eimear,
               Fiachra, Gearóid, Íde, Lorcán, Máire, Nuala, Odhrán, Peadar,
               Ruairí, Sorcha, Treasa, Úna, Aodh, Blathnaid, Colm, Deirdre,
               Éanna, Fionnuala, Gobnait, Liadán, Maolíosa, Neasa, Ronán, Síle]

  lastNames: ["Ó Súilleabháin", "Ní Bhriain", "Ó Conchúir", "Mac Cárthaigh",
              "Ní Dhomhnaill", "Ó Ceallaigh", "Mac Gabhann", "Ó Ríordáin",
