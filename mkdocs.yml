# Builds https://aindriub.github.io/data-prism/ from the existing
# user-facing docs under docs/, plus the repo's own README.md and
# CHANGELOG.md pulled in through docs/index.md and docs/changelog.md. See
# docs/plan/specs/2026-09-23-discoverability.md (T7) and
# docs-site/hooks/site.py for what the hook does.
site_name: Data Prism
site_url: https://aindriub.github.io/data-prism/
site_description: >-
  Data Prism is an open-source privacy layer for Java/Spring teams putting
  LLM agents or MCP clients in front of internal APIs holding customer data.
  It pseudonymises personal data per privacy scope, refuses anything
  unclassified, and can keep a hash-chained audit trail.
repo_url: https://github.com/AindriuB/data-prism
repo_name: AindriuB/data-prism
edit_uri: ""
copyright: Apache-2.0

docs_dir: docs

# Never move or rename a user doc: docs/configuration.md and
# docs/quickstart.md are cited by path from
# data-prism-spring-boot-autoconfigure's DataPrismConfigurationFailureAnalyzer
# and its tests.
exclude_docs: |
  plan/
  adr/
  pack.md
  conventions.md
  workflow.md
  development-plan.md
  design-review.md

theme:
  name: material
  # No Google Fonts: this is also enforced by `check_site.py`, which fails
  # the build if fonts.googleapis or fonts.gstatic appear anywhere in site/.
  font: false
  custom_dir: docs-site/overrides
  # The supplied prism mark (docs-site/logo/supplied/mark-dark.svg, light
  # strokes), copied byte-for-byte to docs/assets/logo.svg — see
  # docs-site/logo/README.md. This is the slate scheme's header logo; the
  # light scheme's white header shows mark-light.svg instead
  # (docs/assets/logo-light.svg), swapped in by
  # docs-site/overrides/partials/logo.html.
  logo: assets/logo.svg
  # Material 9.7.7's base.html emits the favicon <link> before its
  # extrahead block, so this PNG link renders first; docs-site/overrides/
  # main.html adds one more <link rel="icon" type="image/svg+xml"> for
  # favicon.svg inside extrahead, after it. Both are derived from the
  # supplied mark by docs-site/logo/make_favicon.py — see
  # docs-site/logo/README.md.
  favicon: assets/favicon.png
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.suggest

# The palette's actual colour values: the auth server's "Slate + Emerald"
# tokens: auth's app bar (white in the light scheme, dark in slate) as the
# primary, and an emerald accent. See
# docs/stylesheets/extra.css and docs-site/hooks/check_contrast.py.
extra_css:
  - stylesheets/extra.css

# No analytics, no trackers (spec: "Measurement" decision) — deliberately no
# `extra.analytics` key here.

hooks:
  - docs-site/hooks/site.py
  - docs-site/hooks/changelog.py

plugins:
  - search
  - include-markdown
  - llmstxt:
      full_output: llms-full.txt
      sections:
        Get started:
          - index.md
          - quickstart.md
          - protect-your-own-api.md
        Use cases:
          - use-cases/pseudonymise-customer-data-spring-boot.md
          - use-cases/gdpr-data-minimisation-mcp.md
          - use-cases/consistent-pseudonyms-across-systems.md
        Connect an agent:
          - agents/README.md
          - agents/stdio.md
          - agents/remote-http.md
        Developer guide:
          - developer-guide/index.md
          - developer-guide/write-an-adapter.md
          - developer-guide/custom-identity-resolver.md
        Reference:
          - configuration.md
          - tools.md
          - extending.md
          - audit.md
          - architecture.md
        FAQ:
          - faq.md
        Comparison:
          - comparison.md
        Changelog:
          - changelog.md

# All warn, not ignore, so a real problem is still visible in a plain
# `mkdocs build`; `--strict` (used everywhere this is built) turns every one
# of these into a build failure.
validation:
  nav:
    omitted_files: warn
    not_found: warn
    absolute_links: warn
  links:
    not_found: warn
    absolute_links: warn
    unrecognized_links: warn
    anchors: warn

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - tables
  - attr_list
  - md_in_html
  - pymdownx.snippets:
      check_paths: true
      base_path:
        - data-prism-quickstart-extension
        - docker
      restrict_base_path: true
      dedent_subsections: true

# Exactly these eight top-level sections, covering every published page.
# docs/index.md (the home page) is the first page of "Get started" rather
# than its own top-level entry, so it doesn't add a ninth section.
nav:
  - Get started:
      - index.md
      - quickstart.md
      - protect-your-own-api.md
  - Use cases:
      - use-cases/pseudonymise-customer-data-spring-boot.md
      - use-cases/gdpr-data-minimisation-mcp.md
      - use-cases/consistent-pseudonyms-across-systems.md
  - Connect an agent:
      - agents/README.md
      - agents/stdio.md
      - agents/remote-http.md
  - Developer guide:
      - developer-guide/index.md
      - developer-guide/write-an-adapter.md
      - developer-guide/custom-identity-resolver.md
  - Reference:
      - configuration.md
      - tools.md
      - extending.md
      - audit.md
      - architecture.md
  - FAQ: faq.md
  - Comparison: comparison.md
  - Changelog: changelog.md
