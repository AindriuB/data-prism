# Fixture-only configuration for the local Compose quickstart (task 18). None
# of this is a production configuration — see docs/quickstart.md and
# docs/configuration.md for what each of these settings means and how a real
# deployment would choose it instead.
dataprism:
  transport:
    mode: http
    http:
      path: /mcp
  security:
    jwt:
      # fixture-only: must equal data-prism-quickstart-issuer's own
      # quickstart.issuer.issuer-id / .audience (see its application.yaml).
      issuer: ${QUICKSTART_ISSUER_ID:https://issuer.quickstart.invalid}
      audience: ${QUICKSTART_AUDIENCE:data-prism-quickstart-mcp}
      # fixture-only: "issuer" is this Compose network's own issuer service —
      # see compose.yaml. A real deployment points this at an organisation's
      # own identity provider.
      jwk-set-uri: https://issuer:8544/jwks
    caller-claims:
      principal: sub
      roles: roles
      investigation: case_id
  security-policy:
    # A real deployment supplies a CaseAuthorizer bean and lists its allowed clients in allowed-clients;
    # this fixture trusts the token and allows every client.
    case-authorisation: token-trusted
    client-allowlist: unrestricted
    purposes:
      - investigation
    roles:
      investigator:
        - GET_ENTITY_CONTEXT
  privacy:
    profile: DEFAULT
    scope-lifetime: 8h
    hmac-key:
      key-id: quickstart-v1
      # fixture-only: see .env.example for QUICKSTART_HMAC_KEY, which compose.yaml
      # maps to this environment variable. A real deployment never uses a
      # literal value here (dataprism.privacy.hmac-key.value is refused
      # outright) and instead names an approved secret provider reference.
      environment-variable: DATAPRISM_QUICKSTART_HMAC_KEY
  audit:
    sink: slf4j
    writer-id: quickstart
    entity-types:
      - CUSTOMER
  metrics:
    sink: micrometer
  hazelcast:
    # fixture-only: one embedded member that joins nothing. Re-identification
    # refuses single-node (its index lives in the cluster member), and
    # join.mode none binds 127.0.0.1 only. The cluster and name keys are
    # optional on a solo member and, when given, checked as on a joining one;
    # compose.yaml generates both at start and these name the variables.
    topology: embedded
    cluster-name: quickstart-solo
    join:
      mode: none
    security:
      cluster-key:
        key-id: cluster-1
        environment-variable: DATAPRISM_CLUSTER_KEY_MATERIAL
      name-key:
        key-id: name-1
        environment-variable: DATAPRISM_NAME_KEY_MATERIAL
    reidentification-enabled: true
    # fixture-only: names a review that never happened. A real deployment
    # points this at its own reviewed re-identification controls.
    reidentification-controls-reference: quickstart-fixture-controls-not-reviewed
  # Re-identification: four-eyes on (the default, stated here on purpose). The
  # investigator requests and collects; a different principal in the approver
  # role approves. Never an MCP tool: it is served on the operator port below.
  reidentification:
    enabled: true
    four-eyes: true
    purposes:
      - investigation
    roles:
      investigator:
        - REQUEST
      approver:
        - APPROVE
  # The operator surface: its own port, audience and scope, so an MCP token
  # cannot reach it. fixture-only values; the quickstart issuer mints tokens
  # for them on request (see docs/quickstart.md).
  operator:
    enabled: true
    port: 8081
    required-audience: ${QUICKSTART_OPERATOR_AUDIENCE:data-prism-quickstart-operator}
    required-scope: operator
  # --8<-- [start:customer-source]
  sources:
    customer:
      # fixture-only: "fixtures" is this Compose network's own synthetic
      # source API — see compose.yaml and data-prism-quickstart-fixtures. A
      # real deployment points this at its own reviewed enterprise API.
      base-url: https://fixtures:8543
      timeout: 5s
  # --8<-- [end:customer-source]
