# Configuration for the starter-backed HTTP resource server.
# The stdio launcher (ExampleApplication) never starts a Spring context and
# never reads this file.
#
# Nothing below is a secret, a key, a keystore password or a real URL: the
# jwk-set-uri is a local placeholder a real deployment overrides, and every
# test in this module overrides it with its own in-test JWKS endpoint.

server:
  # 0 binds an ephemeral port. A fixed port here would be exactly the
  # hardcoded-port mistake task 07 is required not to make.
  port: 0

dataprism:
  transport:
    mode: http
    http:
      path: /mcp
  security:
    jwt:
      issuer: data-prism-example
      audience: data-prism-mcp
      jwk-set-uri: https://localhost:0/not-configured/jwks
    caller-claims:
      principal: sub
      roles: roles
      investigation: case_id
  security-policy:
    purposes:
      - investigation
    roles:
      investigator:
        - GET_ENTITY_CONTEXT
      privileged-investigator:
        - GET_ENTITY_CONTEXT
        - EXPOSE_SOURCE_NAMES
  privacy:
    profile: DEFAULT
    locale: neutral
    scope-lifetime: 8h
    hmac-key:
      key-id: example-v1
      environment-variable: DATAPRISM_EXAMPLE_HMAC_KEY
  audit:
    sink: slf4j
    writer-id: data-prism-example
  metrics:
    sink: micrometer
  hazelcast:
    topology: embedded
    reidentification-enabled: false
  sources:
    customer-api:
      base-url: https://customer.example.invalid
      timeout: 2s
    account-api:
      base-url: https://account.example.invalid
      timeout: 2s
    order-api:
      base-url: https://order.example.invalid
      timeout: 2s
