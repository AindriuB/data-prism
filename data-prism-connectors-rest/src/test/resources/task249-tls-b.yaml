tls:
  key-store: ks.p12
  key-store-password-env: PATH
  trust-store: ts.p12
  trust-store-password-env: PATH
  store-type: PKCS12
json-sources:
  tls-two:
    base-url: https://tls-two.example.internal
    path: /two/{subject}
    timeout: PT2S
    model-version: two-v1
    subject-json-path: ref
    fields:
      ref:
        identifier: true
