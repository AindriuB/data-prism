json-sources:
  customer-api:
    base-url: http://127.0.0.1:1
    path: /customers/{subject}
    timeout: PT2S
    model-version: customer-v1
    subject-json-path: id
    fields:
      id:
        identifier: true
      name:
        classifications: [PII]
        namespace: PERSON_NAME
        action: SYNTHESIZE
      email:
        classifications: [CONTACT]
        namespace: EMAIL
        action: REDACT
      status:
        nonSensitive: "enumerated lifecycle state"
