# Overlay for the three-member soak (task 263, Part A). Apply it on top of
# docker/multi-instance/compose.yaml, which it does not edit:
#
#   export DATAPRISM_CLUSTER_KEY_MATERIAL="$(openssl rand -hex 32)"
#   export DATAPRISM_NAME_KEY_MATERIAL="$(openssl rand -hex 32)"
#   docker compose -f docker/multi-instance/compose.yaml \
#     -f docker/multi-instance/compose.build.yaml \
#     -f load-test/soak/compose.soak.yaml up --build
#
# (drop compose.build.yaml to use published 0.8.0 images). What it changes:
#   - a third member, server-c, on the member network;
#   - every member lists all three members, trusts the network by assertion
#     (trusted-network: true) and binds only the private member subnet;
#   - links are disabled and no link key is configured, because a joining
#     member refuses both with MISSING_SHARED_LINK_LIMITER: the three-member run
#     has no `follow` and no page link;
#   - a least-connections load balancer with MCP session affinity, `lb`, is the only service published to the host
#     (loopback, port 8080). 5701 is published nowhere.
# Compose >= 2.24.4 is needed for the `!reset` and `!override` tags. The trusted-network
# caveat of the base file applies unchanged: it holds only on a Linux Docker engine
# where cross-network routing to the member port has been checked and found blocked.

x-member-env: &member-env
  DATAPRISM_HAZELCAST_JOIN_MEMBERS: 172.28.57.11:5701,172.28.57.12:5701,172.28.57.13:5701
  DATAPRISM_HAZELCAST_MEMBER_INTERFACE: 172.28.57.*
  DATAPRISM_HAZELCAST_TRUSTEDNETWORK: "true"
  # Links off, and no DATAPRISM_LINKS_KEYID or DATAPRISM_LINKS_KEYS_* anywhere.
  DATAPRISM_LINKS_ENABLED: "false"
  # The role's capabilities: an env list replaces the image's whole YAML list, so index 0 is restated. Without
  # LIST_SOURCES and DESCRIBE_SOURCE about two thirds of the scenario's calls would be denied.
  DATAPRISM_SECURITYPOLICY_ROLES_INVESTIGATOR_0: GET_ENTITY_CONTEXT
  DATAPRISM_SECURITYPOLICY_ROLES_INVESTIGATOR_1: LIST_SOURCES
  DATAPRISM_SECURITYPOLICY_ROLES_INVESTIGATOR_2: DESCRIBE_SOURCE
  # Limits the scenario cannot set on a target (task 263, D1). The budget is per subject per scope, in source reads;
  # soak-three-member.json calls two subjects, one fixture source each: see "The three-member run" in README.md for
  # the refusal share this produces. Source timeouts are a single-node measurement only; the value is the default.
  DATAPRISM_LIMITS_SCOPEREADBUDGET: "12000"
  DATAPRISM_LIMITS_PERSOURCETIMEOUT: 3s

services:
  server-a:
    environment:
      <<: *member-env
    ports: !reset []

  server-b:
    environment:
      <<: *member-env

  server-c:
    extends:
      file: ../../compose.yaml
      service: server
    environment:
      <<: *member-env
      DATAPRISM_HAZELCAST_TOPOLOGY: embedded
      DATAPRISM_HAZELCAST_CLUSTERNAME: prism-example
      DATAPRISM_HAZELCAST_JOIN_MODE: tcp-ip
      DATAPRISM_HAZELCAST_MEMBER_PORT: 5701
      DATAPRISM_HAZELCAST_SECURITY_CLUSTERKEY_KEYID: cluster-1
      DATAPRISM_HAZELCAST_SECURITY_CLUSTERKEY_ENVIRONMENTVARIABLE: DATAPRISM_CLUSTER_KEY_MATERIAL
      DATAPRISM_HAZELCAST_SECURITY_NAMEKEY_KEYID: name-1
      DATAPRISM_HAZELCAST_SECURITY_NAMEKEY_ENVIRONMENTVARIABLE: DATAPRISM_NAME_KEY_MATERIAL
      DATAPRISM_CLUSTER_KEY_MATERIAL: ${DATAPRISM_CLUSTER_KEY_MATERIAL:?export it before up, with openssl rand -hex 32}
      DATAPRISM_NAME_KEY_MATERIAL: ${DATAPRISM_NAME_KEY_MATERIAL:?export it before up, with openssl rand -hex 32}
      DATAPRISM_AUDIT_WRITER_ID: server-c
    networks:
      default: {}
      cluster:
        ipv4_address: 172.28.57.13
    ports: !reset []

  # Least-connections over the three members, with session affinity. An MCP session lives on the member
  # that opened it (a streamable HTTP session id is not known to the other members), so a plain round robin
  # makes every second request fail with "session not found". HAProxy learns the Mcp-Session-Id from the
  # response that issues it and sends the session's later requests to the same member; a request with no id
  # (the one that opens a session) is balanced. A member that dies takes its sessions with it, as for any
  # stateful server: the client must open a new one.
  lb:
    image: haproxy:3.0-alpine
    depends_on:
      - server-a
      - server-b
      - server-c
    configs:
      - source: lb-conf
        target: /usr/local/etc/haproxy/haproxy.cfg
    networks:
      - default
    ports:
      - "127.0.0.1:8080:8080"

configs:
  lb-conf:
    content: |
      defaults
        mode http
        timeout connect 5s
        timeout client 120s
        timeout server 120s
        timeout tunnel 1h
        retries 3
        # A request whose member died is sent to another one, not failed against the dead one.
        option redispatch
      # Docker's embedded DNS, so a recreated member (a new address) is found again, and a member that is not
      # up yet does not stop the proxy starting.
      resolvers docker
        nameserver dns 127.0.0.11:53
        resolve_retries 3
        timeout resolve 1s
        timeout retry 1s
        hold valid 10s
        hold other 10s
        hold refused 10s
        hold nx 10s
        hold timeout 10s
        hold obsolete 10s
      frontend mcp
        bind *:8080
        default_backend members
      backend members
        balance leastconn
        stick-table type string len 64 size 100k expire 24h
        stick on req.hdr(mcp-session-id)
        stick store-response res.hdr(mcp-session-id)
        # The member's /health (liveness): a member that fails two checks in a row takes no traffic until it
        # passes two.
        option httpchk
        http-check send meth GET uri /health ver HTTP/1.1 hdr Host localhost
        http-check expect status 200
        default-server check inter 5s fall 2 rise 2 resolvers docker init-addr last,libc,none
        server server-a server-a:8080
        server server-b server-b:8080
        server server-c server-c:8080
