# This process always serves HTTPS: task 21 refuses a plaintext http://
# JWKS location, and /jwks and /token are served from the same port.
# server.ssl.key-store, key-store-password, key-store-type and key-alias are
# deliberately unset here — they name material generated at first run
# (docker/certs-init for Compose, QuickstartSmokeIT for the Docker-free
# smoke test) and supplied externally. Nothing generated is committed.
server:
  ssl:
    enabled: true
quickstart:
  issuer:
    issuer-id: https://issuer.quickstart.invalid
    audience: data-prism-quickstart-mcp
    default-purpose: investigation
