# Logstash pipeline: receive from Filebeat or read the projection directly, and
# route on event.dataset. Hosts are placeholders.
input {
  file {
    path => "/var/lib/data-prism/audit-json/audit-*.ndjson"
    codec => "json"
    sincedb_path => "/var/lib/logstash/sincedb-data-prism-audit"
  }
}

output {
  if [event][dataset] == "dataprism.audit" {
    elasticsearch {
      hosts => ["https://elasticsearch.example.invalid:9200"]
      api_key => "${ES_API_KEY}"
      data_stream => true
      data_stream_type => "logs"
      data_stream_dataset => "dataprism.audit"
      data_stream_namespace => "default"
    }
  } else {
    elasticsearch {
      hosts => ["https://elasticsearch.example.invalid:9200"]
      api_key => "${ES_API_KEY}"
      index => "unrouted-%{+YYYY.MM.dd}"
    }
  }
}
